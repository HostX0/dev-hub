# One-click free deploy on Render: New -> Blueprint -> pick this repo -> Apply.
# Spins up Postgres + the NestJS API + the Next.js site, wired together automatically.
# Free-tier notes: web services sleep after ~15 min idle (first load after that takes
# 30-60s to wake up), and the free Postgres instance expires after 30 days — fine for a
# quick demo, not for production. See README.md for a permanent setup.

databases:
  - name: dev-hub-db
    plan: free
    databaseName: devhub
    user: devhub

services:
  - type: web
    name: dev-hub-api
    runtime: docker
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    healthCheckPath: /api/settings
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dev-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: dev-hub-web
    runtime: docker
    plan: free
    dockerfilePath: apps/web/Dockerfile
    dockerContext: apps/web
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: dev-hub-api
          property: hostport
